<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caddie">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c6b43'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='white' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='white'/%3E%3C/svg%3E">
<title>Mental Caddie</title>
<style>
:root{
  --bg:#f4f3ee;--surface:#fff;--surface2:#e9e8e1;--ink:#111a15;--muted:#535f58;--line:#d3d6cc;
  --accent:#1c6b43;--accent-ink:#fff;--trouble:#f2b134;--trouble-ink:#2a1c00;
  --good:#2c8a52;--mid:#d39b1c;--bad:#c13f2a;--none:#b9bdb4;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1411;--surface:#17201b;--surface2:#212c26;--ink:#eef3ef;--muted:#9eaba3;--line:#2e3a33;
  --accent:#3ea56e;--accent-ink:#04120a;--trouble:#f0b23c;--trouble-ink:#241800;
  --good:#4cb878;--mid:#e3ad35;--bad:#e2604a;--none:#4a5650;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.page{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:10px;min-height:48px}
.topbar h2{flex:1;font-size:22px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
label.lbl{font-weight:700;font-size:16px;margin-top:4px}
input[type=text],textarea,select{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
textarea{resize:vertical;min-height:64px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:10px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:19px;font-weight:650;cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.trouble{background:var(--trouble);border-color:var(--trouble);color:var(--trouble-ink);font-weight:800}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.xl{min-height:74px;font-size:23px}
.btn.sm{min-height:48px;font-size:16px;border-radius:12px;padding:8px 12px}
.btn.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.btn[disabled]{opacity:.35}
.link{background:none;border:0;color:var(--muted);font-weight:600;text-decoration:underline;padding:10px;min-height:44px;cursor:pointer;font-size:16px}
.iconbtn{flex:none;width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;display:grid;place-items:center;cursor:pointer}
.iconbtn[disabled]{opacity:.3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{width:auto;min-height:48px;font-size:16px;padding:8px 14px;border-radius:999px}

/* home */
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 0 12px;text-align:center}
.logo{width:64px;height:64px}
.big{font-size:22px;font-weight:750}

/* hole screen */
.hole{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom))}
.hbar{display:flex;align-items:center;gap:8px;min-height:52px}
.hnum{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.hnum b{font-size:26px;font-weight:800}
.parsel{display:flex;gap:4px;margin-top:4px;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.parsel button{width:34px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;cursor:pointer}
.parsel button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{display:grid;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.board>div{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:6px 8px}
.bl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bv{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.bv.good{color:var(--good)}
.intent{font-size:15px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intent b{color:var(--ink)}
.hmid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;overflow:hidden}
.strokes{font-size:72px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.slabel{color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.tpill{background:var(--trouble);color:var(--trouble-ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:15px}
.streak{color:var(--good);font-weight:750;font-size:15px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:30px}
.dot{position:relative;display:inline-flex;width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.dot i{flex:1}
.dot b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;text-shadow:0 0 3px #000}
.dot.tap,.dot.pen{background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.dot.pen{color:var(--bad)}
.c-full,.r-acc{background:var(--good)}
.c-half,.r-linger{background:var(--mid)}
.c-doubt,.r-lost{background:var(--bad)}
.note{background:var(--surface);border:1.5px solid var(--trouble);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;width:100%;font-weight:600}
.caddie{font-size:19px;font-style:italic;color:var(--muted);padding:0 8px}
.hact{display:flex;flex-direction:column;gap:10px}
.minis{display:flex;justify-content:space-around;margin-top:-4px}
.sheet{display:flex;flex-direction:column;gap:8px}
.sheet{gap:6px}
.sheet .eyebrow{margin-top:2px}
.sheet .btn{min-height:54px;font-size:16px;line-height:1.15;padding:6px;flex-direction:column;gap:4px;border-radius:14px}
.sheet .sw{flex:none;width:12px;height:12px;border-radius:50%}
.sheetfoot{display:flex;justify-content:space-between;align-items:center}
.hole.logging .intent{display:none}
.hmid.busy .strokes{font-size:48px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.ovin{max-width:520px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:calc(10px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.ovtop{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.ovbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.ovtitle{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.ovsub{font-size:19px;color:var(--muted)}
.rulebig{background:var(--surface);border:2px solid var(--trouble);border-radius:18px;padding:16px;font-size:22px;font-weight:750;line-height:1.3;display:flex;flex-direction:column;gap:10px}
.ask{font-size:19px;font-weight:700;color:var(--muted)}
.ask:before{content:"? ";color:var(--trouble);font-weight:900}
.target{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:8px 10px 8px 14px}
.target .tl{display:flex;flex-direction:column;line-height:1.2}
.target .tl b{font-size:17px}
.target .tl span{font-size:14px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;cursor:pointer}
.tnum{font-size:36px;font-weight:800;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.center{text-align:center}
.orbwrap{display:grid;place-items:center;height:250px}
.orb{width:220px;height:220px;border-radius:50%;background:var(--accent);opacity:.85;transform:scale(.5);transition:transform 1s ease-in-out}
.orblabel{font-size:26px;font-weight:750;text-align:center;min-height:36px}
.menu{display:flex;flex-direction:column;gap:10px}
.rules-t{width:100%;border-collapse:collapse;font-size:16px}
.rules-t td{padding:6px 0;border-top:1px solid var(--line)}
.rules-t td+td{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* summary */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.kv{font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kv.good{color:var(--good)}.kv.bad{color:var(--bad)}
.kl{color:var(--muted);font-size:14px;font-weight:600}
.vs2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sitlist{list-style:none;display:flex;flex-direction:column;gap:6px}
.sitlist li{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.cell{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;text-align:center;padding:3px 0 2px;border-bottom:5px solid var(--none)}
.cell.g-good{border-bottom-color:var(--good)}.cell.g-mid{border-bottom-color:var(--mid)}.cell.g-bad{border-bottom-color:var(--bad)}
.cn{font-size:11px;color:var(--muted);font-weight:700}
.cs{font-size:17px;font-weight:800}
.cs.under{color:var(--good)}
.cm{font-size:11px;font-weight:700;color:var(--muted)}
.tk{position:absolute;top:-7px;right:-5px;font-style:normal;font-size:11px;font-weight:900;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--trouble);color:var(--trouble-ink)}
.tk.no{background:var(--bad);color:#fff}
.quote{font-size:18px;font-style:italic}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .btn{font-size:22px}
.list{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px;min-height:68px}
.ritem .rt{display:flex;flex-direction:column}
.ritem .rs{font-size:13px;color:var(--muted);font-weight:600}
.rule{gap:10px}
.alert{background:var(--bad);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700}
.ok{color:var(--good);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const KEY = 'mgc.v1';

const GOALS = ['Full routine every shot', 'Commit to every target', 'Accept every result', 'Play one shot at a time', 'Smooth tempo'];
const SITS = [['rough', 'Rough'], ['trees', 'Trees / blocked'], ['bunker', 'Bunker'], ['lost', 'Lost ball / penalty'], ['lie', 'Bad lie'], ['badbreak', 'Bad break'], ['bad', 'Just hit a bad one']];
const SIT = Object.fromEntries(SITS.concat([['any', 'Any trouble']]));
const DEFAULT_RULES = [
  { id: 'd-rough', situation: 'rough', text: 'No woods from the rough. Hybrid or 7-iron, to the fat part of the fairway.' },
  { id: 'd-trees', situation: 'trees', text: 'Punch out to the fairway. One shot to get back in play.' },
  { id: 'd-lost', situation: 'lost', text: 'Bogey is now a great score. Middle of the green.' },
  { id: 'd-bunker', situation: 'bunker', text: 'Just get it out. Take the big number off the table.' },
  { id: 'd-lie', situation: 'lie', text: 'Just get it out. Take the big number off the table.' },
  { id: 'd-badbreak', situation: 'badbreak', text: 'Good swing, bad bounce. Nothing to get back. Play the smart shot.' },
  { id: 'd-bad', situation: 'bad', text: 'Same target, smaller swing. Nothing to get back.' },
];
const C_OPTS = [['full', 'Fully in', 'good'], ['half', 'Half in', 'mid'], ['doubt', 'Doubted', 'bad']];
const RES_OPTS = [['good', 'All good', 'good'], ['but', 'Good, but…', 'mid'], ['bad', 'Not what I wanted', 'bad']];
const BUT_SITS = [['bunker', 'Bunker'], ['trees', 'Trees'], ['rough', 'Rough'], ['lost', 'Lost / water'], ['lie', 'Bad lie'], ['badbreak', 'Bad bounce']];
const R_OPTS = [['acc', 'Accepted', 'good'], ['linger', 'Lingered', 'mid'], ['lost', 'Lost it', 'bad']];
const QUESTIONS = ['Which shot takes the big number off the table?', 'Are you picking this to get it back?', 'What would you tell your buddy to hit here?'];
const LINES = ['Pick a small target.', 'Breathe. Walk slow.', 'One shot. This one.', 'Feel it, then trust it.', 'Easy tempo.', 'Nothing to prove on this one.', 'See the shot, then hit it.', 'Fairway first. Then we talk.'];
const GOOD_LINES = ['Good. Same thing again.', "That's the way. Keep it simple.", 'Nice. Nothing changes.', "That's how you play."];
// mental scoring: a committed, accepted shot is mental par
const MENTAL_RULES = [['Fully in + accepted', '0'], ['Good, but… (bad break), accepted', '0'], ['Half in or doubted', '+1'], ['Lingered', '+1'], ['Lost it', '+2'], ['Kept your rule in trouble', '−1'], ['Broke your rule', '+2']];

// ---------- storage ----------
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.version === 1) return d;
  } catch (e) {}
  return { version: 1, rules: DEFAULT_RULES.map(r => ({ ...r })), activeRound: null, rounds: [], exportedAt: 0 };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); ui.saveError = false; }
  catch (e) { ui.saveError = true; }
}

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pick = a => a[Math.floor(Math.random() * a.length)];
const pct = x => x == null ? '–' : Math.round(x * 100) + '%';
const fmtVs = v => v === 0 ? 'E' : (v > 0 ? '+' + v : '−' + (-v));
const fmtAvg = v => v == null ? '–' : Math.abs(v) < .05 ? 'E' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const newHole = n => ({ n, par: 4, shots: [], newTarget: null, trouble: [] });
const cur = () => db.activeRound.holes[db.activeRound.cur];

function rulesFor(sit) {
  const rs = db.rules.filter(r => r.text.trim());
  return rs.filter(r => r.situation === sit).concat(rs.filter(r => r.situation === 'any'));
}
const mentalShot = s => !s.c ? 0 : (s.c === 'full' ? 0 : 1) + (s.r === 'linger' ? 1 : s.r === 'lost' ? 2 : 0);
const mentalHole = h => sum(h.shots, mentalShot) + sum(h.trouble || [], t => t.followed ? -1 : 2);
const mentalGrade = h => !h.shots.some(s => s.c) && !(h.trouble || []).length ? 'none' : mentalHole(h) <= 0 ? 'good' : mentalHole(h) <= 2 ? 'mid' : 'bad';
const roundMental = R => sum(R.holes, mentalHole);

function stats(holes) {
  const played = holes.filter(h => h.shots.length);
  let rated = 0, full = 0, acc = 0, tCount = 0, kept = 0;
  const f = [], b = [], bySit = {};
  played.forEach(h => {
    h.shots.forEach(s => { if (s.c) { rated++; if (s.c === 'full') full++; if (s.r === 'acc') acc++; } });
    const tr = h.trouble || [];
    tr.forEach(t => {
      tCount++; if (t.followed) kept++;
      const o = bySit[t.situation] || (bySit[t.situation] = { n: 0, kept: 0 });
      o.n++; if (t.followed) o.kept++;
    });
    if (tr.length) (tr.every(t => t.followed) ? f : b).push(h.shots.length - h.par);
  });
  const strokes = sum(played, h => h.shots.length);
  return {
    holes: played.length, strokes, vs: strokes - sum(played, h => h.par), mental: sum(played, mentalHole),
    cPct: rated ? full / rated : null, aPct: rated ? acc / rated : null,
    tCount, kept, avgF: avg(f), nF: f.length, avgB: avg(b), nB: b.length, bySit,
  };
}
// live scoreboard: mental score only, updated after every shot
function board(R) {
  const rated = R.holes.flatMap(h => h.shots).filter(s => s.c).sort((a, b) => a.t - b.t);
  let streak = 0;
  for (let i = rated.length - 1; i >= 0 && mentalShot(rated[i]) === 0; i--) streak++;
  return { mental: roundMental(R), streak };
}
function freshSetup() {
  const last = db.rounds[0];
  const s = { goal: 0, custom: '', mantra: '', course: '', holes: 18 };
  if (last) {
    const i = GOALS.indexOf(last.intention.goal);
    if (i >= 0) s.goal = i; else { s.goal = 'custom'; s.custom = last.intention.goal; }
    s.mantra = last.intention.mantra || '';
  }
  return s;
}

// ---------- breathing ----------
let timers = [];
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function runBreath(cycles, done) {
  // physiological sigh: double inhale, long exhale
  const seq = [];
  for (let i = 0; i < cycles; i++) seq.push(['in', 'Breathe in', 2000, .9], ['top', 'A little more', 1000, 1], ['out', 'Long, slow out', 6000, .5]);
  let i = 0;
  const step = () => {
    const orb = document.getElementById('orb'), lab = document.getElementById('orbLabel');
    if (!orb) return;
    if (i >= seq.length) { done(); return; }
    const [k, text, ms, sc] = seq[i++];
    orb.style.transitionDuration = ms + 'ms';
    orb.style.transform = 'scale(' + sc + ')';
    lab.textContent = text;
    if (k !== 'out' && navigator.vibrate) try { navigator.vibrate(k === 'in' ? 40 : 20); } catch (e) {}
    timers.push(setTimeout(step, ms));
  };
  timers.push(setTimeout(step, 400));
}
const orbHTML = skipAct => `<div class="orbwrap"><div id="orb" class="orb"></div></div>
  <div id="orbLabel" class="orblabel">Get ready</div>
  <button class="link" data-act="${skipAct}">Skip</button>`;

// ---------- state ----------
let db = load();
let ui = {
  screen: db.activeRound ? 'hole' : 'home', overlay: null, ov: {},
  log: false, pend: null, say: db.activeRound ? { text: pick(LINES) } : null,
  viewId: null, confirm: null, setup: freshSetup(), reflect: { score: 0, best: '', lesson: '' },
  msg: null, persisted: null, saveError: false,
};
let afterRender = null;

// the caddie slot: one message at a time, optionally with one action
const say = (text, act, label) => { ui.say = { text, act, label }; };

function openReset() {
  if (db.activeRound) db.activeRound.resets++;
  ui.overlay = 'reset'; ui.ov = { step: 'steps' };
}
function endReset() {
  const next = ui.ov.next;
  ui.overlay = null; ui.ov = {};
  if (next) openTrouble(next);
  else say("That one's gone. Next shot is the only shot.", 'trouble', 'Trouble next?');
}
function openTrouble(sit) {
  ui.say = null; ui.log = false;
  ui.overlay = 'trouble'; ui.ov = { step: 'what' };
  if (sit) A.tSit(sit);
}
function toReflect() {
  ui.screen = 'reflect'; ui.log = false; ui.pend = null;
  ui.reflect = { score: 0, best: '', lesson: '' };
}
// the shot sheet is done once commitment and result are in, plus where/how for anything but "All good"
function maybeSaveShot() {
  const p = ui.pend;
  if (!p.c || !p.res) return;
  if (p.res !== 'good' && !p.r) return;
  if (p.res === 'but' && !p.sit) return;
  const r = p.res === 'good' ? 'acc' : p.r;
  cur().shots.push({ c: p.c, res: p.res, r, bb: p.res === 'but', sit: p.sit || null, t: Date.now() });
  ui.log = false; ui.pend = null; ui.say = null;
  // a good shot in a bad spot goes straight to your rule for that spot
  const next = p.res === 'but' && p.sit !== 'badbreak' ? p.sit : null;
  if (r === 'lost') { openReset(); ui.ov.next = next; }
  else if (next) openTrouble(next);
  else if (p.res === 'but') say('Good swing, bad bounce. Keep the swing.', 'trouble', 'Trouble next?');
  else if (p.res === 'bad') say(r === 'linger' ? 'Let that one go before the next one.' : 'Accepted. Next shot is the only shot.', 'trouble', 'Trouble next?');
  else if (p.c === 'doubt') say('Good result, but you doubted it. Pick it, then commit.');
}
function commitTrouble(followed) {
  const o = ui.ov, h = cur(), rs = rulesFor(o.sit);
  h.trouble.push({ situation: o.sit, ruleId: rs[0] ? rs[0].id : null, followed, t: Date.now() });
  h.newTarget = o.target;
  ui.overlay = null; ui.ov = {};
  say((o.penAdded ? 'Penalty stroke added. ' : '') + (followed ? 'Smart play. Now commit to it fully.' : 'Your call. Commit fully, then.'));
}

// ---------- actions ----------
const A = {
  go(v) { ui.screen = v; ui.confirm = null; ui.msg = null; if (v === 'setup') ui.setup = freshSetup(); },
  resume() { ui.screen = 'hole'; },
  goal(v) { ui.setup.goal = v === 'custom' ? 'custom' : +v; },
  holes(v) { ui.setup.holes = +v; },
  start() {
    const s = ui.setup;
    const goal = s.goal === 'custom' ? (s.custom.trim() || 'Play one shot at a time') : GOALS[s.goal];
    db.activeRound = {
      id: uid(), startedAt: Date.now(), endedAt: null, course: s.course.trim(), holesPlanned: s.holes,
      intention: { goal, mantra: s.mantra.trim() }, cur: 0, holes: [newHole(1)], resets: 0, spiralAt: -99, reflection: null,
    };
    Object.assign(ui, { screen: 'hole', log: false, pend: null });
    say('Tee it up. One shot at a time.');
  },
  par(v) { cur().par = +v; },
  logStart() { ui.log = true; ui.pend = { c: null, res: null, sit: null, r: null }; },
  pickC(v) { ui.pend.c = v; maybeSaveShot(); },
  pickRes(v) { if (ui.pend.res !== v) Object.assign(ui.pend, { res: v, sit: null, r: null }); maybeSaveShot(); },
  pickSit(v) { ui.pend.sit = v; maybeSaveShot(); },
  pickR(v) { ui.pend.r = v; maybeSaveShot(); },
  logCancel() { ui.log = false; ui.pend = null; },
  tapIn() { cur().shots.push({ tap: true, t: Date.now() }); ui.say = null; },
  penalty() { cur().shots.push({ pen: true, t: Date.now() }); },
  undo() { cur().shots.pop(); },
  holeDone() {
    const R = db.activeRound;
    if (R.cur + 1 >= R.holesPlanned) { toReflect(); return; }
    const h = cur(), good = h.shots.some(s => s.c) && mentalHole(h) <= 0;
    R.cur++;
    if (!R.holes[R.cur]) R.holes[R.cur] = newHole(R.cur + 1);
    ui.log = false;
    say(pick(good ? GOOD_LINES : LINES));
    const tough = R.holes.slice(Math.max(0, R.cur - 3), R.cur).filter(x => mentalHole(x) >= 2).length;
    if (tough >= 2 && R.cur - R.spiralAt >= 3) {
      R.spiralAt = R.cur;
      say(`Tough stretch. Back to your plan: “${R.intention.goal}”`, 'reset', 'Do a reset');
    }
  },
  prevHole() {
    const R = db.activeRound;
    if (R.cur > 0) { R.cur--; ui.log = false; ui.say = null; }
  },
  sayX() { ui.say = null; },
  trouble() { openTrouble(); },
  reset() { ui.say = null; openReset(); },
  menu() { ui.overlay = 'menu'; ui.ov = {}; },
  endAsk() { ui.ov.confirmEnd = true; },
  endYes() { ui.overlay = null; toReflect(); },
  homeFromRound() { ui.overlay = null; ui.screen = 'home'; },
  discardAsk() { ui.ov.confirmDiscard = true; },
  discardYes() { db.activeRound = null; ui.overlay = null; ui.screen = 'home'; },
  closeOv() { ui.overlay = null; ui.ov = {}; },

  // trouble mode: what happened → your plan
  tSit(v) {
    const o = ui.ov, h = cur();
    o.sit = v;
    if (v === 'lost') { h.shots.push({ pen: true, t: Date.now() }); o.penAdded = true; }
    o.target = Math.max(h.par + 1, h.shots.length + 2, h.newTarget || 0);
    o.q = pick(QUESTIONS);
    o.step = 'plan';
  },
  tHot() { ui.ov.step = 'breath'; afterRender = () => runBreath(2, () => { ui.ov.step = 'plan'; render(); }); },
  tPlan() { ui.ov.step = 'plan'; },
  tT(v) { ui.ov.target = Math.max(cur().shots.length + 1, ui.ov.target + +v); },
  tFollow() { commitTrouble(true); },
  tAnyway() { if (!ui.ov.armed) { ui.ov.armed = true; return; } commitTrouble(false); },

  // reset
  rBreath() { ui.ov.step = 'breath'; afterRender = () => runBreath(2, () => { endReset(); render(); }); },
  rDone() { endReset(); },

  // end of round
  iscore(v) { ui.reflect.score = +v; },
  saveRound() {
    const R = db.activeRound;
    R.endedAt = Date.now();
    R.reflection = { intentionScore: ui.reflect.score || null, bestShot: ui.reflect.best.trim(), lesson: ui.reflect.lesson.trim() };
    db.rounds.unshift(R);
    db.activeRound = null;
    ui.viewId = R.id; ui.screen = 'summary';
  },
  view(v) { ui.viewId = v; ui.screen = 'round'; ui.confirm = null; },
  delAsk() { ui.confirm = 'del'; },
  delYes() { db.rounds = db.rounds.filter(r => r.id !== ui.viewId); ui.screen = 'history'; ui.confirm = null; },

  // rules & backup
  ruleAdd() { db.rules.push({ id: uid(), situation: 'any', text: '' }); },
  ruleDel(v) { db.rules = db.rules.filter(r => r.id !== v); },
  exportData() { doExport(); },
};

// ---------- views ----------
const topbar = (title, act = 'go', v = 'home') =>
  `<div class="topbar"><button class="iconbtn" data-act="${act}" data-v="${v}" aria-label="Back">‹</button><h2>${title}</h2></div>`;
const saveWarn = () => ui.saveError ? `<div class="alert">Couldn't save to this phone's storage. Export a backup now.</div>` : '';
const LOGO = `<svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="var(--accent)"/><circle cx="32" cy="32" r="15" fill="none" stroke="var(--accent-ink)" stroke-width="5"/><circle cx="32" cy="32" r="4.5" fill="var(--accent-ink)"/></svg>`;
const mentalTable = () => `<table class="rules-t">${MENTAL_RULES.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;

function vHome() {
  const R = db.activeRound;
  return `<div class="page">
    <div class="brand">${LOGO}<h1>Mental Caddie</h1><div class="muted">Intention · Commitment · Reaction</div></div>

    ${R ? `<div class="card"><div class="eyebrow">Round in progress</div>
        <div class="big">${esc(R.course || "Today's round")}</div>
        <div class="muted">Hole ${R.cur + 1} · Mental ${fmtVs(roundMental(R))} · ${esc(R.intention.goal)}</div></div>
      <button class="btn primary xl" data-act="resume">Resume round</button>`
      : `<button class="btn primary xl" data-act="go" data-v="setup">Start round</button>`}
    <div class="row2"><button class="btn" data-act="go" data-v="rules">My Rules</button><button class="btn" data-act="go" data-v="history">History</button></div>

}

function vSetup() {
  const s = ui.setup;

  const rules = db.rules.filter(r => r.text.trim());
  return `<div class="page">
    ${topbar('First tee')}
    <label class="lbl">Today's intention</label>
    <div class="chips">
      ${GOALS.map((g, i) => `<button class="btn ${s.goal === i ? 'sel' : ''}" data-act="goal" data-v="${i}">${g}</button>`).join('')}
      <button class="btn ${s.goal === 'custom' ? 'sel' : ''}" data-act="goal" data-v="custom">Write my own</button>
    </div>
    ${s.goal === 'custom' ? `<input type="text" data-bind="setup.custom" value="${esc(s.custom)}" placeholder="My intention today">` : ''}
    <label class="lbl">Mantra <span class="muted">(optional)</span></label>
    <input type="text" data-bind="setup.mantra" value="${esc(s.mantra)}" placeholder="See it, feel it, trust it">
    <label class="lbl">Course <span class="muted">(optional)</span></label>
    <input type="text" data-bind="setup.course" value="${esc(s.course)}" placeholder="Course name">
    <label class="lbl">Holes</label>
    <div class="row2">${[9, 18].map(n => `<button class="btn ${s.holes === n ? 'sel' : ''}" data-act="holes" data-v="${n}">${n}</button>`).join('')}</div>
    ${rules.length ? `<div class="card"><div class="eyebrow">Today I play by my rules</div>
      ${rules.map(r => `<div><b>${esc(SIT[r.situation] || r.situation)}:</b> ${esc(r.text)}</div>`).join('')}</div>` : ''}
    <div class="card"><div class="eyebrow">Your mental score</div>
      <div>Mental par is a committed, accepted shot. Keeping your rule in trouble is a mental birdie.</div></div>
    ${mem ? `<div class="card"><div class="eyebrow">Remember this one</div><div class="quote">“${esc(mem.reflection.bestShot)}”</div><div class="muted small">${fmtDate(mem.startedAt)}</div></div>` : ''}
    <button class="btn primary xl" data-act="start">Tee it up</button>

}

function dot(s) {
  if (s.pen) return '<span class="dot pen" title="Penalty">P</span>';
  if (s.tap) return '<span class="dot tap" title="Tap-in">T</span>';
  return `<span class="dot"><i class="c-${s.c}"></i><i class="r-${s.r}"></i>${s.bb ? '<b>↯</b>' : ''}</span>`;
}

function sayHTML() {
  const s = ui.say;
  if (!s) return '';
  if (!s.act) return `<div class="caddie">“${esc(s.text)}”</div>`;
  return `<div class="note"><div>${esc(s.text)}</div>
    <div class="row2"><button class="btn sm ${s.act === 'trouble' ? 'trouble' : ''}" data-act="${s.act}">${s.label}</button><button class="btn sm ghost" data-act="sayX">Dismiss</button></div></div>`;
}

function vHole() {
  const R = db.activeRound, h = cur(), n = h.shots.length, b = board(R);
  const last = R.cur + 1 >= R.holesPlanned;
  const target = h.newTarget ? `<span class="tpill">Target ${h.newTarget}</span>` : '';
  const streak = b.streak >= 3 ? `<div class="streak">● ${b.streak} clean in a row</div>` : '';

  let mid, act;
  if (ui.log) {
    const p = ui.pend;
    const row = (opts, sel, a) => `<div class="row3">${opts.map(([v, l, g]) =>
      `<button class="btn ${sel === v ? 'sel' : ''}" data-act="${a}" data-v="${v}">${g ? `<span class="sw" style="background:var(--${g})"></span>` : ''}${l}</button>`).join('')}</div>`;
    mid = `<div class="dots">${h.shots.map(dot).join('')}${target}</div>`;
    act = `<div class="sheet">
      <div class="eyebrow">Shot ${n + 1} · Commitment</div>${row(C_OPTS, p.c, 'pickC')}
      <div class="eyebrow">Result</div>${row(RES_OPTS, p.res, 'pickRes')}
      ${p.res === 'but' ? `<div class="eyebrow">Where'd it end up?</div>${row(BUT_SITS, p.sit, 'pickSit')}` : ''}
      ${p.res && p.res !== 'good' ? `<div class="eyebrow">How are you taking it?</div>${row(R_OPTS, p.r, 'pickR')}` : ''}
      <div class="sheetfoot"><span class="muted small">Saves when complete</span><button class="link" data-act="logCancel">Cancel</button></div></div>`;
  } else {
    mid = `<div class="strokes">${n}</div>
      <div class="slabel">${n === 1 ? 'stroke' : 'strokes'} this hole${target}</div>
      <div class="dots">${h.shots.map(dot).join('')}${n ? '<button class="link" data-act="undo">Undo</button>' : ''}</div>
      ${streak}${sayHTML()}`;
    act = `<button class="btn primary xl" data-act="logStart">Log shot</button>
      <div class="row2"><button class="btn trouble" data-act="trouble">Trouble</button>
        <button class="btn" data-act="holeDone" ${n ? '' : 'disabled'}>${last ? 'Finish' : 'Hole done'} →</button></div>
      <div class="minis"><button class="link" data-act="tapIn">+ Tap-in</button><button class="link" data-act="penalty">+ Penalty</button><button class="link" data-act="reset">Reset</button></div>`;
  }

  return `<div class="hole ${ui.log ? 'logging' : ''}">
    <div class="hbar">
      <button class="iconbtn" data-act="prevHole" ${R.cur ? '' : 'disabled'} aria-label="Previous hole">‹</button>
      <div class="hnum"><b>Hole ${h.n}</b>
        <div class="parsel">PAR ${[3, 4, 5].map(p => `<button class="${h.par === p ? 'sel' : ''}" data-act="par" data-v="${p}">${p}</button>`).join('')}</div></div>
      <button class="iconbtn" data-act="menu" aria-label="Menu">⋯</button>
    </div>
    <div class="board">
      <div><span class="bl">Mental</span><span class="bv ${b.mental <= 0 ? 'good' : ''}">${fmtVs(b.mental)}</span></div>
    </div>
    <div class="intent"><b>${esc(R.intention.goal)}</b>${R.intention.mantra ? ' · “' + esc(R.intention.mantra) + '”' : ''}</div>
    ${saveWarn()}
    <div class="hmid ${ui.say && ui.say.act && !ui.log ? 'busy' : ''}">${mid}</div>
    <div class="hact">${act}</div>
  </div>`;
}

function ovWrap(label, body) {
  return `<div class="overlay"><div class="ovin">
    <div class="ovtop"><span class="eyebrow">${label}</span><button class="iconbtn" data-act="closeOv" aria-label="Close">✕</button></div>
    <div class="ovbody">${body}</div></div></div>`;
}

function ovTrouble() {
  const o = ui.ov, h = cur();
  let body;
  if (o.step === 'what') {
    body = `<div class="ovtitle">What happened?</div>
      <div class="list">${SITS.map(([k, l]) => `<button class="btn" data-act="tSit" data-v="${k}">${l}</button>`).join('')}</div>`;
  } else if (o.step === 'breath') {
    body = orbHTML('tPlan');
  } else {
    const rs = rulesFor(o.sit), d = o.target - h.par;
    const lastShot = h.shots.filter(s => s.c).pop();
    body = `${lastShot && lastShot.res === 'but' ? '<div class="ovsub">Good swing. Bad result. Nothing to get back.</div>' : ''}
      <div class="eyebrow">${esc(SIT[o.sit])} · your rule</div>
      <div class="rulebig">${rs.length ? rs.map(r => `<div>${esc(r.text)}</div>`).join('')
        : '<div>Take the big number off the table. Fairway first, then the green.</div>'}</div>
      <div class="ask">${o.q}</div>
      <div class="target"><div class="tl"><b>New target</b><span>${d === 1 ? 'Bogey is a good score now' : d >= 2 ? 'A good score now' : 'Par ' + h.par}</span></div>
        <div class="stepper"><button data-act="tT" data-v="-1" aria-label="Lower">−</button><div class="tnum">${o.target}</div><button data-act="tT" data-v="1" aria-label="Higher">+</button></div></div>
      <button class="btn primary xl" data-act="tFollow">Playing by my rule</button>
      <div class="row2"><button class="btn sm ${o.armed ? 'danger' : 'ghost'}" data-act="tAnyway">${o.armed ? 'Tap again: going for it' : 'Going for it anyway'}</button>
        <button class="btn sm ghost" data-act="tHot">I'm hot. Breathe.</button></div>`;
  }
  return ovWrap(`Trouble · Hole ${h.n}`, body);
}

function ovReset() {
  const body = ui.ov.step === 'breath' ? orbHTML('rDone')
    : `<div class="ovtitle">Take your 10 steps.</div>
      <div class="ovsub">Let it out. Then let it go.</div>
      <button class="btn primary xl" data-act="rBreath">Done. Breathe.</button>`;
  return ovWrap('Reset', body);
}

function ovMenu() {
  const o = ui.ov;
  return ovWrap('Round', `<div class="menu">
    ${o.confirmEnd ? '<button class="btn primary xl" data-act="endYes">Yes, end the round</button>' : '<button class="btn primary xl" data-act="endAsk">End round</button>'}
    <button class="btn" data-act="homeFromRound">Home (round stays open)</button>

    ${o.confirmDiscard ? '<button class="btn danger" data-act="discardYes">Tap again to discard this round</button>' : '<button class="btn ghost" data-act="discardAsk">Discard round</button>'}

}

function vReflect() {
  const R = db.activeRound, r = ui.reflect;
  return `<div class="page">
    ${topbar('Round complete', 'resume', '')}
    <div class="card"><label class="lbl">Did you play to your intention?</label>
      <div class="quote">“${esc(R.intention.goal)}”</div>
      <div class="scale">${[1, 2, 3, 4, 5].map(i => `<button class="btn ${r.score === i ? 'sel' : ''}" data-act="iscore" data-v="${i}">${i}</button>`).join('')}</div>

}

function troubleBlock(s) {
  if (!s.tCount) return `<div class="card"><div class="eyebrow">Trouble</div><div class="muted">No trouble moments logged.</div></div>`;
  const sits = Object.entries(s.bySit).map(([k, o]) => `<li><span>${esc(SIT[k] || k)}</span><b>${o.kept}/${o.n} kept</b></li>`).join('');
  return `<div class="card"><div class="eyebrow">Trouble · rules kept ${s.kept}/${s.tCount}</div>
    <div class="vs2">
      <div><div class="kv good">${fmtAvg(s.avgF)}</div><div class="kl">Followed your rule<br>${s.nF} hole${s.nF === 1 ? '' : 's'}</div></div>
      <div><div class="kv bad">${fmtAvg(s.avgB)}</div><div class="kl">Broke it<br>${s.nB} hole${s.nB === 1 ? '' : 's'}</div></div>
    </div>
    <div class="muted small">Average score vs par on holes where trouble hit.</div>
    <ul class="sitlist">${sits}</ul></div>`;
}

function strip(R) {
  const cells = R.holes.filter(h => h.shots.length).map(h => {
    const v = h.shots.length - h.par, tr = h.trouble || [];
    const t = tr.length ? (tr.every(x => x.followed) ? '<i class="tk">✓</i>' : '<i class="tk no">✗</i>') : '';
    return `<div class="cell g-${mentalGrade(h)}"><div class="cn">${h.n}</div><div class="cs ${v < 0 ? 'under' : ''}">${h.shots.length}</div><div class="cm">M${fmtVs(mentalHole(h))}</div>${t}</div>`;
  }).join('');
  return `<div class="card"><div class="eyebrow">Hole by hole</div><div class="strip">${cells}</div>
    <div class="muted small">Strokes, then mental score (M) · ✓ rule kept · ✗ rule broken</div></div>`;
}

function vSummaryBody(R) {
  const s = stats(R.holes), ref = R.reflection || {};
  return `<div class="muted">${fmtDate(R.startedAt)}${R.course ? ' · ' + esc(R.course) : ''} · ${s.holes} holes</div>
    <div class="kpis">
      <div class="kpi"><div class="kv ${s.mental <= 0 ? 'good' : ''}">${fmtVs(s.mental)}</div><div class="kl">Mental score</div></div>
      <div class="kpi"><div class="kv">${s.strokes}</div><div class="kl">Strokes · ${fmtVs(s.vs)}</div></div>
      <div class="kpi"><div class="kv">${pct(s.cPct)}</div><div class="kl">Commitment</div></div>
      <div class="kpi"><div class="kv">${pct(s.aPct)}</div><div class="kl">Acceptance</div></div>
    </div>

    <div class="card"><div class="eyebrow">Intention</div><div class="quote">“${esc(R.intention.goal)}”</div>
      ${R.intention.mantra ? `<div class="muted">${esc(R.intention.mantra)}</div>` : ''}
      <div>${ref.intentionScore ? `Played to it: <b>${ref.intentionScore}/5</b> · ` : ''}${R.resets} reset${R.resets === 1 ? '' : 's'} used</div></div>

    <h2 style="margin-top:12px">Round saved</h2>

function vRound() {
  const R = db.rounds.find(r => r.id === ui.viewId);
  if (!R) return vHistory();
  return `<div class="page">
    ${topbar(esc(R.course || 'Round'), 'go', 'history')}
    ${vSummaryBody(R)}

function vHistory() {
  if (!db.rounds.length) return `<div class="page">${topbar('History')}<div class="card"><div class="muted">No rounds yet. Your rounds will show up here.</div></div></div>`;
  const s = stats(db.rounds.flatMap(r => r.holes));
  const bank = db.rounds.filter(r => r.reflection && r.reflection.bestShot);
  const avgMental = avg(db.rounds.map(roundMental));
  return `<div class="page">
    ${topbar('History')}
    <div class="kpis">
      <div class="kpi"><div class="kv ${avgMental <= 0 ? 'good' : ''}">${fmtAvg(avgMental)}</div><div class="kl">Avg mental score</div></div>
      <div class="kpi"><div class="kv">${db.rounds.length}</div><div class="kl">Rounds</div></div>
      <div class="kpi"><div class="kv">${pct(s.cPct)}</div><div class="kl">Commitment</div></div>
      <div class="kpi"><div class="kv">${pct(s.aPct)}</div><div class="kl">Acceptance</div></div>
    </div>
    ${troubleBlock(s)}
    ${bank.length ? `<div class="card"><div class="eyebrow">Good shots bank</div>
      ${bank.map(r => `<div><div class="quote">“${esc(r.reflection.bestShot)}”</div><div class="muted small">${fmtDate(r.startedAt)}${r.course ? ' · ' + esc(r.course) : ''}</div></div>`).join('')}</div>` : ''}
    <div class="eyebrow">Rounds</div>
    <div class="list">${db.rounds.map(r => {
      const rs = stats(r.holes);
      return `<button class="btn ritem" data-act="view" data-v="${r.id}">
        <span class="rt"><span>${esc(r.course || 'Round')}</span><span class="rs">${fmtDate(r.startedAt)} · ${rs.strokes} strokes (${fmtVs(rs.vs)})</span></span>
        <span>M ${fmtVs(rs.mental)}</span></button>`;
    }).join('')}</div>
  </div>`;
}

function vRules() {
  return `<div class="page">
    ${topbar('My Rules')}
    <div class="muted">Write these at home, when you're calm. On the course you don't decide, you just follow your rule.</div>
    ${db.rules.map(r => `<div class="card rule">
      <select data-bind="rule.situation" data-id="${r.id}">
        ${Object.entries(SIT).map(([k, l]) => `<option value="${k}" ${r.situation === k ? 'selected' : ''}>When: ${l}</option>`).join('')}
      </select>
      <textarea data-bind="rule.text" data-id="${r.id}" rows="2" placeholder="Then I will…">${esc(r.text)}</textarea>
      <button class="link" style="align-self:flex-end" data-act="ruleDel" data-v="${r.id}">Delete</button>
    </div>`).join('')}
    <button class="btn" data-act="ruleAdd">+ Add a rule</button>
  </div>`;
}

function vBackup() {
  return `<div class="page">
    ${topbar('Backup')}
    ${saveWarn()}
    <div class="muted">Your rounds live only on this phone, in this browser. Export a backup now and then.</div>
    <button class="btn primary" data-act="exportData">Export backup (.json)</button>
    <label class="btn">Import backup<input type="file" id="importFile" accept="application/json,.json" hidden></label>
    ${ui.msg ? `<div class="note">${esc(ui.msg)}</div>` : ''}
    <div class="card"><b>iPhone tip</b>
      <div>Add this page to your Home Screen (Share → Add to Home Screen) and always open it from there. Its storage is kept separate from Safari's, so Safari's clean-ups won't touch it.</div></div>
    <div class="muted small">${db.rounds.length} rounds · ${db.rules.length} rules${db.activeRound ? ' · 1 round in progress' : ''}${ui.persisted === true ? ' · <span class="ok">storage protected</span>' : ''}</div>
  </div>`;
}

function render() {
  if ((ui.screen === 'hole' || ui.screen === 'reflect') && !db.activeRound) ui.screen = 'home';
  const screens = { home: vHome, setup: vSetup, hole: vHole, reflect: vReflect, summary: vSummary, round: vRound, history: vHistory, rules: vRules, backup: vBackup };
  let html = (screens[ui.screen] || vHome)();
  if (ui.overlay === 'trouble' && db.activeRound) html += ovTrouble();
  else if (ui.overlay === 'reset') html += ovReset();
  else if (ui.overlay === 'menu') html += ovMenu();
  document.getElementById('app').innerHTML = html;
  if (!ui.overlay && ui.screen !== 'hole') window.scrollTo(0, 0);
}

// ---------- backup ----------
async function doExport() {
  const json = JSON.stringify(db, null, 2);
  const name = `mental-caddie-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([json], name, { type: 'application/json' });
  db.exportedAt = db.rounds.length;
  save();
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(d) {
  if (!d || !Array.isArray(d.rounds)) throw new Error('bad file');
  const ids = new Set(db.rounds.map(r => r.id));
  let added = 0;
  d.rounds.forEach(r => { if (r && r.id && r.holes && !ids.has(r.id)) { db.rounds.push(r); added++; } });
  db.rounds.sort((a, b) => b.startedAt - a.startedAt);
  if (Array.isArray(d.rules)) {
    // the backup's rules win; keep only local rules the user added that the backup doesn't know about
    const rules = d.rules.filter(r => r && r.id);
    const known = new Set(rules.map(r => r.id));
    db.rules = rules.concat(db.rules.filter(r => !known.has(r.id) && !r.id.startsWith('d-')));
  }
  if (!db.activeRound && d.activeRound) db.activeRound = d.activeRound;
  return added;
}

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = A[b.dataset.act];
  if (!fn) return;
  clearTimers();
  fn(b.dataset.v);
  save();
  render();
  if (afterRender) { const f = afterRender; afterRender = null; f(); }
});
function onBind(e) {
  const t = e.target, k = t.dataset.bind;
  if (!k) return;
  const [scope, field] = k.split('.');
  if (scope === 'setup') ui.setup[field] = t.value;
  else if (scope === 'reflect') ui.reflect[field] = t.value;
  else if (scope === 'rule') {
    const r = db.rules.find(r => r.id === t.dataset.id);
    if (r) { r[field] = t.value; save(); }
  }
}
document.addEventListener('input', onBind);
document.addEventListener('change', e => {
  onBind(e);
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { const n = importData(JSON.parse(reader.result)); save(); ui.msg = `Imported. ${n} new round${n === 1 ? '' : 's'} added.`; }
    catch (err) { ui.msg = "That file doesn't look like a Mental Caddie backup."; }
    render();
  };
  reader.readAsText(e.target.files[0]);
});

if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().then(v => { ui.persisted = v; }).catch(() => {});
}
render();
</script>
</body>
</html>
